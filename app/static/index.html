<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job-Lens — 채용공고 분석 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2d3142;
      --accent: #6366f1;
      --text: #e2e8f0;
      --subtext: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .tab-btn {
      padding: 0.8rem 1.25rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text);
      padding: 0.3rem 0;
    }
    .radio-label input[type="radio"] { accent-color: var(--accent); cursor: pointer; }

    .example-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.1rem;
      cursor: pointer;
      text-align: left;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.15s, background 0.15s;
    }
    .example-card:hover { border-color: var(--accent); background: #1e2236; }

    .msg-user {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .msg-user .bubble {
      background: var(--accent);
      color: #fff;
      padding: 0.7rem 1rem;
      border-radius: 1rem 1rem 0.25rem 1rem;
      max-width: 70%;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-assistant {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: flex-start;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }
    .msg-assistant .bubble {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 0.25rem 1rem 1rem 1rem;
      max-width: 82%;
      font-size: 0.9rem;
      word-break: break-word;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      background: var(--border);
      color: var(--subtext);
      padding: 0.18rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.73rem;
      margin: 0.15rem;
    }

    .loading-dots { display: flex; gap: 5px; align-items: center; }
    .loading-dots span {
      width: 6px; height: 6px;
      background: var(--subtext);
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .prose { line-height: 1.75; }
    .prose h1 { font-size: 1.15rem; font-weight: 700; margin: 1rem 0 0.5rem; color: var(--text); }
    .prose h2 { font-size: 1.0rem; font-weight: 600; margin: 0.9rem 0 0.4rem; color: var(--text); }
    .prose h3 { font-size: 0.93rem; font-weight: 600; margin: 0.75rem 0 0.35rem; color: var(--text); }
    .prose p { color: var(--subtext); margin-bottom: 0.5rem; }
    .prose ul, .prose ol { color: var(--subtext); padding-left: 1.3rem; margin-bottom: 0.5rem; }
    .prose li { margin-bottom: 0.2rem; }
    .prose strong { color: var(--text); }
    .prose code { background: var(--border); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.82em; font-family: 'Courier New', monospace; color: var(--text); }
    .prose hr { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; }
    .prose blockquote { border-left: 3px solid var(--accent); padding-left: 0.75rem; color: var(--subtext); margin: 0.5rem 0; }

    .skill-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.77rem;
      font-weight: 500;
      margin: 0.2rem 0.15rem;
    }

    .stage-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    .chat-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      resize: none;
      transition: border-color 0.15s;
      line-height: 1.5;
      min-height: 44px;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--subtext); }
    .chat-input:disabled { opacity: 0.55; cursor: not-allowed; }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 0.6rem;
      color: #fff;
      padding: 0.65rem 1.1rem;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 30;
    }
    .overlay.show { display: block; }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: -240px;
        top: 0;
        bottom: 0;
        z-index: 40;
        transition: left 0.25s ease;
      }
      #sidebar.open { left: 0; }
      #menu-btn { display: flex !important; }
      .header-badges { display: none !important; }
    }
  </style>
</head>
<body style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

<div id="overlay" class="overlay" onclick="closeSidebar()"></div>

<!-- Header -->
<header style="background: var(--card); border-bottom: 1px solid var(--border); padding: 0.85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10;">
  <div style="display: flex; align-items: center; gap: 0.75rem;">
    <button id="menu-btn" onclick="toggleSidebar()" style="display: none; align-items: center; justify-content: center; background: none; border: none; color: var(--text); cursor: pointer; padding: 0.25rem; line-height: 1;">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <span style="font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em;">🔍 Job-Lens</span>
  </div>
  <div class="header-badges" style="display: flex; gap: 0.5rem;">
    <span style="background: #1e3a5f; color: #60a5fa; padding: 0.2rem 0.65rem; border-radius: 9999px; font-size: 0.73rem; font-weight: 500;">백엔드</span>
    <span style="background: #064e3b; color: #34d399; padding: 0.2rem 0.65rem; border-radius: 9999px; font-size: 0.73rem; font-weight: 500;">QA</span>
    <span style="background: #2e1065; color: #a78bfa; padding: 0.2rem 0.65rem; border-radius: 9999px; font-size: 0.73rem; font-weight: 500;">AI검증</span>
  </div>
</header>

<!-- Body -->
<div style="display: flex; flex: 1; overflow: hidden;">

  <!-- Sidebar -->
  <aside id="sidebar" style="width: 215px; min-width: 215px; background: var(--card); border-right: 1px solid var(--border); padding: 1.5rem 1rem; overflow-y: auto; flex-shrink: 0;">
    <div style="margin-bottom: 2rem;">
      <p style="font-size: 0.67rem; font-weight: 600; color: var(--subtext); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.8rem;">직군 필터</p>
      <div style="display: flex; flex-direction: column;">
        <label class="radio-label"><input type="radio" name="jobType" value="" checked onchange="onFilterChange()"> 전체</label>
        <label class="radio-label"><input type="radio" name="jobType" value="backend" onchange="onFilterChange()"> 백엔드</label>
        <label class="radio-label"><input type="radio" name="jobType" value="qa" onchange="onFilterChange()"> QA</label>
        <label class="radio-label"><input type="radio" name="jobType" value="ai_verification" onchange="onFilterChange()"> AI검증</label>
      </div>
    </div>
    <div>
      <p style="font-size: 0.67rem; font-weight: 600; color: var(--subtext); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.8rem;">경력 필터</p>
      <div style="display: flex; flex-direction: column;">
        <label class="radio-label"><input type="radio" name="careerType" value="" checked onchange="onFilterChange()"> 전체</label>
        <label class="radio-label"><input type="radio" name="careerType" value="entry" onchange="onFilterChange()"> 신입</label>
        <label class="radio-label"><input type="radio" name="careerType" value="experienced" onchange="onFilterChange()"> 경력</label>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main style="flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0;">

    <!-- Tab bar -->
    <div style="background: var(--card); border-bottom: 1px solid var(--border); display: flex; flex-shrink: 0; padding: 0 0.5rem;">
      <button class="tab-btn active" data-tab="chat" onclick="switchTab('chat')">채팅</button>
      <button class="tab-btn" data-tab="skills" onclick="switchTab('skills')">기술스택</button>
      <button class="tab-btn" data-tab="roadmap" onclick="switchTab('roadmap')">로드맵</button>
    </div>

    <!-- Chat Panel -->
    <div id="panel-chat" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
      <div id="messages" style="flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem;">
        <div id="examples" style="max-width: 520px; margin: 1.5rem auto 0;">
          <p style="text-align: center; color: var(--subtext); font-size: 0.83rem; margin-bottom: 1rem;">
            500건의 채용공고 데이터를 기반으로 질문해보세요
          </p>
          <div style="display: flex; flex-direction: column; gap: 0.65rem;">
            <button class="example-card" data-q="신입 백엔드 개발자가 뭐부터 공부해야 해?" onclick="sendExample(this.dataset.q)">
              <p style="font-size: 0.72rem; color: #60a5fa; font-weight: 600; margin-bottom: 0.3rem;">💡 예시 질문</p>
              <p style="color: var(--text); font-size: 0.875rem; line-height: 1.4;">신입 백엔드 개발자가 뭐부터 공부해야 해?</p>
            </button>
            <button class="example-card" data-q="QA 엔지니어가 가장 많이 요구하는 기술은?" onclick="sendExample(this.dataset.q)">
              <p style="font-size: 0.72rem; color: #34d399; font-weight: 600; margin-bottom: 0.3rem;">💡 예시 질문</p>
              <p style="color: var(--text); font-size: 0.875rem; line-height: 1.4;">QA 엔지니어가 가장 많이 요구하는 기술은?</p>
            </button>
            <button class="example-card" data-q="AI 검증 직군은 Python을 얼마나 요구해?" onclick="sendExample(this.dataset.q)">
              <p style="font-size: 0.72rem; color: #a78bfa; font-weight: 600; margin-bottom: 0.3rem;">💡 예시 질문</p>
              <p style="color: var(--text); font-size: 0.875rem; line-height: 1.4;">AI 검증 직군은 Python을 얼마나 요구해?</p>
            </button>
          </div>
        </div>
      </div>
      <div style="padding: 0.9rem 1.25rem; border-top: 1px solid var(--border); background: var(--bg); flex-shrink: 0;">
        <div style="display: flex; gap: 0.65rem; align-items: flex-end; max-width: 860px; margin: 0 auto;">
          <textarea id="chat-input" class="chat-input" rows="2"
            placeholder="채용 데이터에 대해 질문해보세요... (Shift+Enter로 줄바꿈)"
            onkeydown="onInputKeydown(event)"></textarea>
          <button id="send-btn" class="send-btn" onclick="onSendClick()">전송</button>
        </div>
      </div>
    </div>

    <!-- Skills Panel -->
    <div id="panel-skills" style="display: none; flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem;">
      <div id="skills-content" style="max-width: 860px; margin: 0 auto;">
        <div style="display: flex; align-items: center; justify-content: center; height: 180px;">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <!-- Roadmap Panel -->
    <div id="panel-roadmap" style="display: none; flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem;">
      <div id="roadmap-content" style="max-width: 860px; margin: 0 auto;">
        <div style="text-align: center; padding: 4rem 1rem; color: var(--subtext);">
          <p style="font-size: 2rem; margin-bottom: 1rem;">🗺️</p>
          <p style="font-size: 0.95rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem;">직군을 선택해주세요</p>
          <p style="font-size: 0.83rem; line-height: 1.6;">사이드바에서 백엔드, QA, AI검증 중 하나를 선택하면<br>맞춤 커리어 로드맵을 제공합니다.</p>
        </div>
      </div>
    </div>

  </main>
</div>

<script>
  // ── State ─────────────────────────────────────────────────────────────────
  const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
  let activeTab = 'chat';
  let isLoading = false;
  let messages = [];
  let skillsChart = null;

  const JOB_COLORS = { '': '#6366f1', backend: '#3b82f6', qa: '#10b981', ai_verification: '#8b5cf6' };
  const JOB_LABELS = { '': '전체', backend: '백엔드', qa: 'QA', ai_verification: 'AI검증' };
  const CAREER_LABELS = { '': '전체', entry: '신입', experienced: '경력' };

  function getJobType() { return document.querySelector('input[name="jobType"]:checked')?.value || ''; }
  function getCareerType() { return document.querySelector('input[name="careerType"]:checked')?.value || ''; }

  // ── Tab ───────────────────────────────────────────────────────────────────
  function switchTab(tab) {
    activeTab = tab;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    ['chat', 'skills', 'roadmap'].forEach(t => {
      const el = document.getElementById(`panel-${t}`);
      el.style.display = 'none';
    });

    const panel = document.getElementById(`panel-${tab}`);
    panel.style.display = tab === 'chat' ? 'flex' : 'block';
    panel.classList.add('fade-in');
    setTimeout(() => panel.classList.remove('fade-in'), 300);

    if (tab === 'skills') loadSkills();
    if (tab === 'roadmap') loadRoadmap();
  }

  // ── Filter ────────────────────────────────────────────────────────────────
  function onFilterChange() {
    if (activeTab === 'skills') loadSkills();
    if (activeTab === 'roadmap') loadRoadmap();
  }

  // ── Mobile Sidebar ────────────────────────────────────────────────────────
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  // ── Chat ──────────────────────────────────────────────────────────────────
  function onInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSendClick(); }
  }

  function onSendClick() {
    const input = document.getElementById('chat-input');
    const q = input.value.trim();
    if (!q || isLoading) return;
    input.value = '';
    sendQuery(q);
  }

  function sendExample(q) {
    if (isLoading) return;
    sendQuery(q);
  }

  async function sendQuery(question) {
    if (isLoading) return;
    isLoading = true;

    const examples = document.getElementById('examples');
    if (examples) examples.style.display = 'none';

    appendUserMessage(question);

    setInputDisabled(true);

    const loadingId = 'loading-' + Date.now();
    appendLoadingMessage(loadingId);

    try {
      const body = { question };
      const jt = getJobType();
      const ct = getCareerType();
      if (jt) body.job_type = jt;
      if (ct) body.career_type = ct;

      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      removeEl(loadingId);
      appendAssistantMessage(data.answer, data.sources || []);
    } catch (e) {
      removeEl(loadingId);
      appendAssistantMessage(`오류가 발생했습니다: ${e.message}`, []);
    }

    setInputDisabled(false);
    isLoading = false;
  }

  function setInputDisabled(disabled) {
    document.getElementById('chat-input').disabled = disabled;
    document.getElementById('send-btn').disabled = disabled;
  }

  function appendUserMessage(content) {
    const div = document.createElement('div');
    div.className = 'msg-user fade-in';
    div.innerHTML = `<div class="bubble">${escHtml(content)}</div>`;
    document.getElementById('messages').appendChild(div);
    scrollBottom();
  }

  function appendAssistantMessage(content, sources) {
    const sourcesHtml = sources.length
      ? `<div style="margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border);">
           <span style="font-size: 0.71rem; color: var(--subtext); display: block; margin-bottom: 0.35rem;">참조 공고</span>
           ${sources.map(s => `<span class="source-badge">${escHtml(s)}</span>`).join('')}
         </div>`
      : '';

    const div = document.createElement('div');
    div.className = 'msg-assistant fade-in';
    div.innerHTML = `
      <div class="msg-avatar">AI</div>
      <div class="bubble">
        <div class="prose">${marked.parse(content)}</div>
        ${sourcesHtml}
      </div>`;
    document.getElementById('messages').appendChild(div);
    scrollBottom();
  }

  function appendLoadingMessage(id) {
    const div = document.createElement('div');
    div.id = id;
    div.className = 'msg-assistant';
    div.innerHTML = `
      <div class="msg-avatar">AI</div>
      <div class="bubble" style="padding: 0.75rem 1rem;">
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>`;
    document.getElementById('messages').appendChild(div);
    scrollBottom();
  }

  function removeEl(id) { document.getElementById(id)?.remove(); }
  function scrollBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  }
  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── Skills ────────────────────────────────────────────────────────────────
  async function loadSkills() {
    const jt = getJobType();
    const ct = getCareerType();

    document.getElementById('skills-content').innerHTML = `
      <div style="display: flex; align-items: center; justify-content: center; height: 180px;">
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>`;

    try {
      const p = new URLSearchParams({ top_n: '10' });
      if (jt) p.set('job_type', jt);
      if (ct) p.set('career_type', ct);

      const res = await fetch(`${API_BASE}/stats/skills?${p}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (!data.skills.length) {
        document.getElementById('skills-content').innerHTML = `
          <div style="text-align: center; padding: 3rem; color: var(--subtext);">
            <p>데이터가 없습니다. 먼저 <code>/ingest</code> 로 데이터를 수집해주세요.</p>
          </div>`;
        return;
      }

      renderSkills(data, jt, ct);
    } catch (e) {
      document.getElementById('skills-content').innerHTML = `
        <div style="text-align: center; padding: 3rem; color: var(--subtext);">
          <p>데이터를 불러오지 못했습니다.</p>
          <p style="font-size: 0.78rem; margin-top: 0.4rem; color: #ef4444;">${escHtml(e.message)}</p>
        </div>`;
    }
  }

  function renderSkills(data, jt, ct) {
    const color = JOB_COLORS[jt] || JOB_COLORS[''];

    document.getElementById('skills-content').innerHTML = `
      <div class="fade-in">
        <div style="margin-bottom: 1.25rem;">
          <h2 style="font-size: 1.05rem; font-weight: 600;">기술 스택 Top ${data.skills.length}</h2>
          <p style="font-size: 0.82rem; color: var(--subtext); margin-top: 0.25rem;">
            ${JOB_LABELS[jt] || '전체'} · ${CAREER_LABELS[ct] || '전체'} · 공고 <strong style="color: var(--text);">${data.total_jobs}</strong>건 기준
          </p>
        </div>
        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.25rem; height: 380px; margin-bottom: 1.25rem;">
          <canvas id="skills-chart"></canvas>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0.45rem;">
          ${data.skills.map((s, i) => `
            <div style="display: flex; align-items: center; gap: 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.6rem 0.9rem;">
              <span style="font-size: 0.78rem; color: var(--subtext); width: 1.5rem; text-align: right; flex-shrink: 0;">${i + 1}</span>
              <span style="font-size: 0.875rem; font-weight: 500; flex: 1;">${escHtml(s.skill)}</span>
              <span style="font-size: 0.78rem; color: var(--subtext);">${s.count}건</span>
              <span style="font-size: 0.875rem; font-weight: 700; color: ${color}; width: 3.5rem; text-align: right;">${Math.round(s.ratio * 100)}%</span>
            </div>
          `).join('')}
        </div>
      </div>`;

    if (skillsChart) { skillsChart.destroy(); skillsChart = null; }
    const ctx = document.getElementById('skills-chart').getContext('2d');
    skillsChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.skills.map(s => s.skill),
        datasets: [{
          data: data.skills.map(s => Math.round(s.ratio * 100)),
          backgroundColor: color + 'bb',
          borderColor: color,
          borderWidth: 1,
          borderRadius: 4,
        }],
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.parsed.x}%  (${data.skills[ctx.dataIndex].count}건)`,
            },
          },
        },
        scales: {
          x: {
            max: 100,
            ticks: { color: '#94a3b8', callback: v => v + '%' },
            grid: { color: '#2d314255' },
          },
          y: {
            ticks: { color: '#e2e8f0', font: { size: 12 } },
            grid: { display: false },
          },
        },
      },
    });
  }

  // ── Roadmap ───────────────────────────────────────────────────────────────
  async function loadRoadmap() {
    const jt = getJobType();
    const ct = getCareerType();

    if (!jt) {
      document.getElementById('roadmap-content').innerHTML = `
        <div style="text-align: center; padding: 4rem 1rem; color: var(--subtext);">
          <p style="font-size: 2rem; margin-bottom: 1rem;">🗺️</p>
          <p style="font-size: 0.95rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem;">직군을 선택해주세요</p>
          <p style="font-size: 0.83rem; line-height: 1.6;">사이드바에서 백엔드, QA, AI검증 중 하나를 선택하면<br>맞춤 커리어 로드맵을 제공합니다.</p>
        </div>`;
      return;
    }

    document.getElementById('roadmap-content').innerHTML = `
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; gap: 0.75rem;">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        <p style="font-size: 0.8rem; color: var(--subtext);">로드맵 생성 중… (15~30초 소요)</p>
      </div>`;

    try {
      const p = new URLSearchParams({ job_type: jt });
      if (ct) p.set('career_type', ct);

      const [statsRes, roadmapRes] = await Promise.all([
        fetch(`${API_BASE}/stats/skills?${p}&top_n=20`),
        fetch(`${API_BASE}/roadmap?${p}`),
      ]);

      if (!statsRes.ok || !roadmapRes.ok) throw new Error('API 오류가 발생했습니다.');
      const statsData = await statsRes.json();
      const roadmapData = await roadmapRes.json();

      renderRoadmap(statsData, roadmapData, jt, ct);
    } catch (e) {
      document.getElementById('roadmap-content').innerHTML = `
        <div style="text-align: center; padding: 3rem; color: var(--subtext);">
          <p>로드맵을 불러오지 못했습니다.</p>
          <p style="font-size: 0.78rem; margin-top: 0.4rem; color: #ef4444;">${escHtml(e.message)}</p>
        </div>`;
    }
  }

  function renderRoadmap(statsData, roadmapData, jt, ct) {
    const color = JOB_COLORS[jt] || JOB_COLORS[''];
    const skills = statsData.skills || [];

    const stage1 = skills.filter(s => s.ratio >= 0.8);
    const stage2 = skills.filter(s => s.ratio >= 0.5 && s.ratio < 0.8);
    const stage3 = skills.filter(s => s.ratio < 0.5);

    function badges(list, textColor, bgColor) {
      if (!list.length) return `<p style="font-size: 0.8rem; color: var(--subtext);">해당 기술 없음</p>`;
      return list.map(s => `
        <span class="skill-badge" style="background: ${bgColor}; color: ${textColor};">
          ${escHtml(s.skill)}
          <span style="opacity: 0.7; font-size: 0.68em; margin-left: 2px;">${Math.round(s.ratio * 100)}%</span>
        </span>`).join('');
    }

    document.getElementById('roadmap-content').innerHTML = `
      <div class="fade-in">
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.05rem; font-weight: 600;">${JOB_LABELS[jt]} 커리어 로드맵</h2>
          <p style="font-size: 0.82rem; color: var(--subtext); margin-top: 0.25rem;">
            ${CAREER_LABELS[ct] || '전체'} · 공고 <strong style="color: var(--text);">${statsData.total_jobs}</strong>건 기준
          </p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
          <div class="stage-card" style="border-top: 3px solid #ef4444;">
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem;">
              <span style="background: #7f1d1d; color: #fca5a5; font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 9999px;">1단계</span>
              <span style="font-size: 0.875rem; font-weight: 600;">필수 기초</span>
            </div>
            <p style="font-size: 0.73rem; color: var(--subtext); margin-bottom: 0.7rem;">공고 80% 이상 요구</p>
            <div>${badges(stage1, '#fca5a5', '#7f1d1d55')}</div>
          </div>

          <div class="stage-card" style="border-top: 3px solid var(--warning);">
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem;">
              <span style="background: #78350f; color: #fcd34d; font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 9999px;">2단계</span>
              <span style="font-size: 0.875rem; font-weight: 600;">핵심 기술</span>
            </div>
            <p style="font-size: 0.73rem; color: var(--subtext); margin-bottom: 0.7rem;">공고 50~80% 요구</p>
            <div>${badges(stage2, '#fcd34d', '#78350f55')}</div>
          </div>

          <div class="stage-card" style="border-top: 3px solid var(--success);">
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem;">
              <span style="background: #064e3b; color: #6ee7b7; font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 9999px;">3단계</span>
              <span style="font-size: 0.875rem; font-weight: 600;">우대 기술</span>
            </div>
            <p style="font-size: 0.73rem; color: var(--subtext); margin-bottom: 0.7rem;">50% 미만 · 차별화 포인트</p>
            <div>${badges(stage3, '#6ee7b7', '#064e3b55')}</div>
          </div>
        </div>

        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.5rem;">
          <p style="font-size: 0.78rem; font-weight: 600; color: var(--subtext); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem;">
            <span style="color: ${color}; font-size: 1em;">●</span> AI 추천 학습 순서
          </p>
          <div class="prose">${marked.parse(roadmapData.roadmap_text || '')}</div>
        </div>
      </div>`;
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  marked.setOptions({ breaks: true, gfm: true });
</script>
</body>
</html>
