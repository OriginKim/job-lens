<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job-Lens — IT 직무 분석 플랫폼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3142; border-radius: 9999px; }

    .tab-btn {
      color: #94a3b8;
      border-bottom: 2px solid transparent;
      padding: 10px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s, border-color 0.15s;
      cursor: pointer;
      background: none;
      border-left: none; border-right: none; border-top: none;
    }
    .tab-btn:hover { color: #e2e8f0; }
    .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeUp 0.18s ease; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%            { opacity: 1; }
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px; background: #94a3b8; animation: blink 1.4s infinite; margin: 0 1px; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* markdown prose */
    .prose h1, .prose h2, .prose h3 { color: #e2e8f0; font-weight: 600; margin: 0.8em 0 0.4em; }
    .prose h1 { font-size: 1.15rem; }
    .prose h2 { font-size: 1.05rem; }
    .prose h3 { font-size: 0.95rem; }
    .prose p  { color: #cbd5e1; margin: 0.45em 0; line-height: 1.65; font-size: 0.875rem; }
    .prose ul, .prose ol { color: #cbd5e1; padding-left: 1.25rem; margin: 0.45em 0; }
    .prose li { margin: 0.25em 0; line-height: 1.65; font-size: 0.875rem; }
    .prose strong { color: #e2e8f0; font-weight: 600; }
    .prose code { background: #2d3142; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.8rem; color: #a5b4fc; }
    .prose a { color: #6366f1; text-decoration: underline; }

    @media (max-width: 767px) {
      #sidebar {
        position: fixed; top: 0; left: -240px; bottom: 0;
        z-index: 50; width: 240px;
        transition: left 0.25s ease;
        background: #0f1117;
      }
      #sidebar.open { left: 0; }
      #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; }
      #overlay.visible { display: block; }
    }
  </style>
</head>
<body class="bg-[#0f1117] text-[#e2e8f0] flex flex-col" style="height: 100dvh; overflow: hidden;">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 h-12 border-b border-[#2d3142] shrink-0">
    <div class="flex items-center gap-3">
      <button id="menuBtn" class="md:hidden p-1 text-[#94a3b8] hover:text-[#e2e8f0] transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <span class="text-[#6366f1] font-bold text-lg leading-none">◉</span>
        <span class="font-bold text-[#e2e8f0] text-base tracking-tight">Job-Lens</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="px-2 py-0.5 rounded text-xs font-medium bg-[#1e3a5f]/80 text-[#60a5fa]">백엔드</span>
      <span class="px-2 py-0.5 rounded text-xs font-medium bg-[#1a3a2a]/80 text-[#34d399]">QA</span>
      <span class="px-2 py-0.5 rounded text-xs font-medium bg-[#2d1f4a]/80 text-[#c084fc]">AI검증</span>
    </div>
  </header>

  <!-- Mobile overlay -->
  <div id="overlay" onclick="closeSidebar()"></div>

  <!-- Body -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[220px] border-r border-[#2d3142] flex flex-col shrink-0 overflow-y-auto">
      <div class="p-5 flex flex-col gap-7">

        <div>
          <p class="text-[10px] font-semibold text-[#94a3b8] uppercase tracking-widest mb-3">직군</p>
          <div id="jobTypeFilter" class="flex flex-col gap-1"></div>
        </div>

        <div>
          <p class="text-[10px] font-semibold text-[#94a3b8] uppercase tracking-widest mb-3">경력</p>
          <div id="careerTypeFilter" class="flex flex-col gap-1"></div>
        </div>

      </div>
    </aside>

    <!-- Content -->
    <main class="flex-1 flex flex-col overflow-hidden">

      <!-- Tabs -->
      <div class="flex items-end px-4 border-b border-[#2d3142] shrink-0 gap-1">
        <button class="tab-btn active" data-tab="chat">채팅</button>
        <button class="tab-btn" data-tab="skills">기술스택</button>
        <button class="tab-btn" data-tab="roadmap">로드맵</button>
      </div>

      <!-- Panels -->
      <div class="flex-1 overflow-hidden relative">

        <!-- Chat panel -->
        <div id="panel-chat" class="absolute inset-0 flex flex-col">
          <div id="chatMessages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
            <div id="exampleCards" class="flex flex-col items-center justify-center h-full gap-3">
              <p class="text-sm text-[#94a3b8] mb-1">채용공고 데이터 기반으로 질문해보세요</p>
              <button class="example-q w-full max-w-md text-left px-4 py-3 rounded-xl bg-[#1a1d27] border border-[#2d3142] hover:border-[#6366f1]/40 transition-all text-sm text-[#94a3b8] hover:text-[#e2e8f0]"
                data-q="신입 백엔드 개발자가 뭐부터 공부해야 해?">
                <span class="text-[#6366f1] mr-2 font-bold">→</span>신입 백엔드 개발자가 뭐부터 공부해야 해?
              </button>
              <button class="example-q w-full max-w-md text-left px-4 py-3 rounded-xl bg-[#1a1d27] border border-[#2d3142] hover:border-[#10b981]/40 transition-all text-sm text-[#94a3b8] hover:text-[#e2e8f0]"
                data-q="QA 엔지니어가 가장 많이 요구하는 기술은?">
                <span class="text-[#10b981] mr-2 font-bold">→</span>QA 엔지니어가 가장 많이 요구하는 기술은?
              </button>
              <button class="example-q w-full max-w-md text-left px-4 py-3 rounded-xl bg-[#1a1d27] border border-[#2d3142] hover:border-[#a855f7]/40 transition-all text-sm text-[#94a3b8] hover:text-[#e2e8f0]"
                data-q="AI 검증 직군은 Python을 얼마나 요구해?">
                <span class="text-[#a855f7] mr-2 font-bold">→</span>AI 검증 직군은 Python을 얼마나 요구해?
              </button>
            </div>
          </div>
          <div class="shrink-0 p-3 border-t border-[#2d3142]">
            <div class="flex gap-2 items-end max-w-3xl mx-auto">
              <textarea id="chatInput" rows="1"
                class="flex-1 bg-[#1a1d27] border border-[#2d3142] focus:border-[#6366f1]/50 rounded-xl px-4 py-2.5 text-sm text-[#e2e8f0] placeholder-[#94a3b8]/60 focus:outline-none resize-none transition-colors leading-relaxed"
                placeholder="질문 입력 (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
              <button id="sendBtn"
                class="shrink-0 h-10 px-4 bg-[#6366f1] hover:bg-[#4f52d9] disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-sm font-medium transition-colors">
                전송
              </button>
            </div>
          </div>
        </div>

        <!-- Skills panel -->
        <div id="panel-skills" class="absolute inset-0 overflow-y-auto p-4 hidden">
          <div class="max-w-2xl mx-auto">
            <div id="skillsHeader" class="flex items-center justify-between mb-4">
              <h2 class="text-base font-semibold">기술 스택 분석</h2>
              <span id="skillsMeta" class="text-xs text-[#94a3b8]"></span>
            </div>
            <div id="skillsLoading" class="hidden flex justify-center items-center h-48">
              <div class="flex gap-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>
            <div id="skillsEmpty" class="hidden flex justify-center items-center h-48 text-sm text-[#94a3b8]">
              데이터 없음 — /ingest 로 공고를 먼저 수집해주세요.
            </div>
            <div id="skillsChart-wrapper" class="bg-[#1a1d27] rounded-xl border border-[#2d3142] p-4">
              <canvas id="skillsChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Roadmap panel -->
        <div id="panel-roadmap" class="absolute inset-0 overflow-y-auto p-4 hidden">
          <div class="max-w-2xl mx-auto">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-base font-semibold">커리어 로드맵</h2>
              <button id="aiRoadmapBtn"
                class="hidden px-3 py-1.5 text-xs bg-[#1a1d27] border border-[#2d3142] hover:border-[#6366f1]/50 rounded-lg text-[#94a3b8] hover:text-[#e2e8f0] transition-all">
                AI 로드맵 생성
              </button>
            </div>
            <div id="roadmapLoading" class="hidden flex justify-center items-center h-48">
              <div class="flex gap-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            </div>
            <div id="roadmapEmpty" class="hidden flex justify-center items-center h-48 text-sm text-[#94a3b8]">
              데이터 없음 — /ingest 로 공고를 먼저 수집해주세요.
            </div>
            <div id="roadmapStages" class="flex flex-col gap-3 mb-5"></div>
            <div id="aiRoadmapSection" class="hidden">
              <div class="flex items-center gap-2 mb-3">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-[#6366f1]/20 text-[#a5b4fc]">AI</span>
                <span class="text-sm font-semibold text-[#e2e8f0]">AI 생성 로드맵</span>
              </div>
              <div id="aiRoadmapLoading" class="hidden p-4 rounded-xl bg-[#1a1d27] border border-[#2d3142] mb-3">
                <div class="flex gap-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
              </div>
              <div id="aiRoadmapText" class="prose p-4 rounded-xl bg-[#1a1d27] border border-[#2d3142]"></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const S = {
  jobType: '',
  careerType: '',
  activeTab: 'chat',
  chatBusy: false,
  chartInst: null,
};

// ── Constants ─────────────────────────────────────────────────────────────────
const JOB_OPTS = [
  { value: '',              label: '전체',   color: '#6366f1' },
  { value: 'backend',       label: '백엔드', color: '#3b82f6' },
  { value: 'qa',            label: 'QA',     color: '#10b981' },
  { value: 'ai_verification', label: 'AI검증', color: '#a855f7' },
];
const CAREER_OPTS = [
  { value: '',           label: '전체' },
  { value: 'entry',      label: '신입' },
  { value: 'experienced',label: '경력' },
];
const JOB_LABEL = Object.fromEntries(JOB_OPTS.map(o => [o.value, o.label]));
const JOB_COLOR = Object.fromEntries(JOB_OPTS.map(o => [o.value, o.color]));

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(e.detail || r.statusText);
  }
  return r.json();
}

function dots() {
  return '<div class="flex gap-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
}

// ── Sidebar / mobile ──────────────────────────────────────────────────────────
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
});
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}

// ── Filter radios ─────────────────────────────────────────────────────────────
function buildFilter(containerId, opts, stateKey, onChange) {
  const container = document.getElementById(containerId);
  opts.forEach(opt => {
    const id = `${containerId}-${opt.value || 'all'}`;
    const label = document.createElement('label');
    label.htmlFor = id;
    label.className = 'flex items-center gap-2.5 cursor-pointer py-0.5 group';
    label.innerHTML = `
      <input type="radio" id="${id}" name="${containerId}" value="${opt.value}" class="sr-only"${opt.value === '' ? ' checked' : ''}>
      <span class="radio-wrap w-4 h-4 rounded-full border-2 border-[#2d3142] flex items-center justify-center transition-colors">
        <span class="radio-dot w-2 h-2 rounded-full transition-opacity opacity-0" style="background:${opt.color || '#6366f1'}"></span>
      </span>
      <span class="radio-txt text-sm transition-colors ${opt.value === '' ? 'text-[#e2e8f0]' : 'text-[#94a3b8] group-hover:text-[#e2e8f0]'}">${opt.label}</span>`;
    container.appendChild(label);

    const input = label.querySelector('input');
    const dot   = label.querySelector('.radio-dot');
    const wrap  = label.querySelector('.radio-wrap');
    const txt   = label.querySelector('.radio-txt');

    if (opt.value === '') {
      dot.style.opacity = '1';
      wrap.style.borderColor = opt.color || '#6366f1';
    }

    input.addEventListener('change', () => {
      // reset all in group
      container.querySelectorAll('label').forEach(l => {
        l.querySelector('.radio-dot').style.opacity = '0';
        l.querySelector('.radio-wrap').style.borderColor = '#2d3142';
        l.querySelector('.radio-txt').classList.replace('text-[#e2e8f0]', 'text-[#94a3b8]');
      });
      dot.style.opacity = '1';
      wrap.style.borderColor = opt.color || '#6366f1';
      txt.classList.replace('text-[#94a3b8]', 'text-[#e2e8f0]');
      S[stateKey] = opt.value;
      closeSidebar();
      onChange();
    });
  });
}

function onFilterChange() {
  if (S.activeTab === 'skills')  loadSkills();
  if (S.activeTab === 'roadmap') loadRoadmap();
}

buildFilter('jobTypeFilter',    JOB_OPTS,    'jobType',    onFilterChange);
buildFilter('careerTypeFilter', CAREER_OPTS, 'careerType', onFilterChange);

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function switchTab(tab) {
  S.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('[id^="panel-"]').forEach(p => {
    const mine = p.id === `panel-${tab}`;
    p.classList.toggle('hidden', !mine);
    if (mine) { p.classList.add('fade-in'); setTimeout(() => p.classList.remove('fade-in'), 300); }
  });
  if (tab === 'skills')  loadSkills();
  if (tab === 'roadmap') loadRoadmap();
}

// ── Chat ──────────────────────────────────────────────────────────────────────
const chatInput = document.getElementById('chatInput');
const sendBtn   = document.getElementById('sendBtn');
const chatArea  = document.getElementById('chatMessages');

document.querySelectorAll('.example-q').forEach(btn => {
  btn.addEventListener('click', () => {
    chatInput.value = btn.dataset.q;
    sendMessage();
  });
});

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', sendMessage);

function appendMsg(html) {
  const wrap = document.createElement('div');
  wrap.className = 'fade-in';
  wrap.innerHTML = html;
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
  return wrap;
}

async function sendMessage() {
  const q = chatInput.value.trim();
  if (!q || S.chatBusy) return;

  document.getElementById('exampleCards')?.remove();
  S.chatBusy = true;
  chatInput.disabled = true;
  sendBtn.disabled    = true;
  chatInput.value     = '';
  chatInput.style.height = 'auto';

  appendMsg(`
    <div class="flex justify-end">
      <div class="max-w-[82%] px-4 py-2.5 bg-[#6366f1]/20 border border-[#6366f1]/25 rounded-2xl rounded-tr-sm text-sm text-[#e2e8f0] leading-relaxed">
        ${esc(q)}
      </div>
    </div>`);

  const loadEl = appendMsg(`
    <div class="flex justify-start">
      <div class="px-4 py-3 bg-[#1a1d27] border border-[#2d3142] rounded-2xl rounded-tl-sm">
        ${dots()}
      </div>
    </div>`);

  try {
    const body = { question: q };
    if (S.jobType)    body.job_type    = S.jobType;
    if (S.careerType) body.career_type = S.careerType;

    const data = await api('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    loadEl.remove();
    const sourcesHtml = data.sources?.length
      ? `<div class="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-[#2d3142]">
           ${data.sources.map(s => `<span class="px-2 py-0.5 text-xs rounded-full bg-[#0f1117] border border-[#2d3142] text-[#94a3b8]">${esc(s)}</span>`).join('')}
         </div>`
      : '';
    appendMsg(`
      <div class="flex justify-start">
        <div class="max-w-[90%] px-4 py-3 bg-[#1a1d27] border border-[#2d3142] rounded-2xl rounded-tl-sm">
          <div class="prose text-sm">${marked.parse(data.answer)}</div>
          ${sourcesHtml}
        </div>
      </div>`);
  } catch (err) {
    loadEl.remove();
    appendMsg(`
      <div class="flex justify-start">
        <div class="max-w-[90%] px-4 py-3 bg-[#1a1d27] border border-[#2d3142] rounded-2xl rounded-tl-sm text-sm text-red-400">
          오류: ${esc(err.message)}
        </div>
      </div>`);
  }

  S.chatBusy = false;
  chatInput.disabled = false;
  sendBtn.disabled    = false;
  chatInput.focus();
}

// ── Skills ────────────────────────────────────────────────────────────────────
let skillsLoaded = false;

async function loadSkills() {
  const loading = document.getElementById('skillsLoading');
  const empty   = document.getElementById('skillsEmpty');
  const wrapper = document.getElementById('skillsChart-wrapper');
  const meta    = document.getElementById('skillsMeta');

  loading.classList.remove('hidden'); loading.style.display = 'flex';
  empty.classList.add('hidden');
  wrapper.style.opacity = '0.4';

  const p = new URLSearchParams({ top_n: 10 });
  if (S.jobType)    p.set('job_type',    S.jobType);
  if (S.careerType) p.set('career_type', S.careerType);

  try {
    const data = await api(`/stats/skills?${p}`);
    loading.classList.add('hidden'); loading.style.display = '';
    wrapper.style.opacity = '1';

    if (!data.skills?.length) {
      empty.classList.remove('hidden'); empty.style.display = 'flex';
      return;
    }

    meta.textContent = `${JOB_LABEL[S.jobType] || '전체'}${S.careerType ? ' · ' + (S.careerType === 'entry' ? '신입' : '경력') : ''} · ${data.total_jobs}건`;
    renderChart(data.skills);
    skillsLoaded = true;
  } catch (err) {
    loading.classList.add('hidden'); loading.style.display = '';
    wrapper.style.opacity = '1';
    empty.textContent = `오류: ${err.message}`;
    empty.classList.remove('hidden'); empty.style.display = 'flex';
  }
}

function renderChart(skills) {
  const color   = JOB_COLOR[S.jobType] || '#6366f1';
  const canvas  = document.getElementById('skillsChart');
  const wrapper = document.getElementById('skillsChart-wrapper');
  const h       = Math.max(280, skills.length * 38);
  wrapper.style.height = (h + 32) + 'px';
  canvas.style.height  = h + 'px';

  if (S.chartInst) { S.chartInst.destroy(); S.chartInst = null; }

  S.chartInst = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: skills.map(s => s.skill),
      datasets: [{
        data: skills.map(s => Math.round(s.ratio * 100)),
        backgroundColor: color + 'bb',
        borderColor: color,
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: false,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x}%` } },
      },
      scales: {
        x: {
          grid: { color: '#2d3142' },
          ticks: { color: '#94a3b8', font: { size: 11 }, callback: v => v + '%' },
          max: 100,
        },
        y: {
          grid: { display: false },
          ticks: { color: '#e2e8f0', font: { size: 12 } },
        },
      },
    },
  });
}

// ── Roadmap ───────────────────────────────────────────────────────────────────
async function loadRoadmap() {
  const loading = document.getElementById('roadmapLoading');
  const empty   = document.getElementById('roadmapEmpty');
  const stages  = document.getElementById('roadmapStages');
  const aiBtn   = document.getElementById('aiRoadmapBtn');
  const aiSec   = document.getElementById('aiRoadmapSection');

  loading.classList.remove('hidden'); loading.style.display = 'flex';
  empty.classList.add('hidden');
  stages.innerHTML = '';
  aiSec.classList.add('hidden');
  aiBtn.classList.toggle('hidden', !S.jobType);
  if (S.jobType) {
    aiBtn.textContent = 'AI 로드맵 생성';
    aiBtn.disabled = false;
    aiBtn.onclick = generateAiRoadmap;
  }

  const p = new URLSearchParams({ top_n: 20 });
  if (S.jobType)    p.set('job_type',    S.jobType);
  if (S.careerType) p.set('career_type', S.careerType);

  try {
    const data = await api(`/stats/skills?${p}`);
    loading.classList.add('hidden'); loading.style.display = '';

    if (!data.skills?.length) {
      empty.classList.remove('hidden'); empty.style.display = 'flex';
      return;
    }

    renderStages(data.skills);
  } catch (err) {
    loading.classList.add('hidden'); loading.style.display = '';
    empty.textContent = `오류: ${err.message}`;
    empty.classList.remove('hidden'); empty.style.display = 'flex';
  }
}

function renderStages(skills) {
  const tiers = [
    { label: '1단계 · 필수 기초',  desc: '공고 50% 이상 요구',        color: '#10b981', bg: '#10b98112', border: '#10b98135', test: s => s.ratio >= 0.5  },
    { label: '2단계 · 핵심 기술',  desc: '공고 25~50% 요구',          color: '#f59e0b', bg: '#f59e0b12', border: '#f59e0b35', test: s => s.ratio >= 0.25 && s.ratio < 0.5 },
    { label: '3단계 · 우대 기술',  desc: '25% 미만 · 차별화 포인트',  color: '#6366f1', bg: '#6366f112', border: '#6366f135', test: s => s.ratio < 0.25  },
  ];

  const stages = document.getElementById('roadmapStages');
  tiers.forEach(tier => {
    const items = skills.filter(tier.test);
    const div = document.createElement('div');
    div.className = 'rounded-xl p-4 fade-in';
    div.style.cssText = `background:${tier.bg}; border:1px solid ${tier.border};`;
    div.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold" style="color:${tier.color}">${tier.label}</span>
          <span class="text-xs text-[#94a3b8]">${tier.desc}</span>
        </div>
        <span class="text-xs text-[#94a3b8]">${items.length}개</span>
      </div>
      ${items.length
        ? `<div class="flex flex-wrap gap-1.5">
            ${items.map(sk => `
              <span class="px-2.5 py-1 rounded-lg text-xs font-medium" style="background:${tier.color}18; color:${tier.color}; border:1px solid ${tier.color}30">
                ${esc(sk.skill)} <span style="opacity:0.6">${Math.round(sk.ratio * 100)}%</span>
              </span>`).join('')}
          </div>`
        : `<p class="text-xs text-[#94a3b8]">해당 없음</p>`}`;
    stages.appendChild(div);
  });
}

async function generateAiRoadmap() {
  if (!S.jobType) return;
  const btn     = document.getElementById('aiRoadmapBtn');
  const sec     = document.getElementById('aiRoadmapSection');
  const loadEl  = document.getElementById('aiRoadmapLoading');
  const textEl  = document.getElementById('aiRoadmapText');

  btn.disabled = true;
  btn.textContent = '생성 중...';
  sec.classList.remove('hidden');
  loadEl.classList.remove('hidden');
  textEl.innerHTML = '';

  const p = new URLSearchParams({ job_type: S.jobType });
  if (S.careerType) p.set('career_type', S.careerType);

  try {
    const data = await api(`/roadmap?${p}`);
    loadEl.classList.add('hidden');
    textEl.innerHTML = marked.parse(data.roadmap_text);
    btn.textContent = '다시 생성';
  } catch (err) {
    loadEl.classList.add('hidden');
    textEl.innerHTML = `<p class="text-sm text-red-400">오류: ${esc(err.message)}</p>`;
    btn.textContent = 'AI 로드맵 생성';
  }
  btn.disabled = false;
}

// ── Init ──────────────────────────────────────────────────────────────────────
switchTab('chat');
</script>
